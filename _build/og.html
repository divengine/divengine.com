<!doctype html>
<!-- Open Graph card (1200x630). _build/og.js renders it once per page: og.html#<title>|<subtitle>|<screenshot>. -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: Inter, sans-serif; color: #cfdcf0; background: radial-gradient(900px 400px at 90% -10%, rgba(79,216,255,.22), transparent 60%), linear-gradient(160deg, #142846, #0b1830 75%); position: relative; }
  body::before { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 36px 36px; }
  .text { position: absolute; left: 64px; top: 64px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 14px; font: 700 26px Outfit, sans-serif; color: #fff; }
  .brand img { width: 52px; height: 48px; border-radius: 6px; }
  h1 { font: 800 50px/1.08 Outfit, sans-serif; color: #fff; margin: 56px 0 20px; letter-spacing: -.01em; }
  p { font-size: 23px; line-height: 1.45; margin: 0; }
  .tags { position: absolute; left: 64px; bottom: 56px; display: flex; gap: 10px; }
  .tags span { padding: 7px 14px; border-radius: 999px; font-size: 16px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); color: #e3ecf8; }
  .shot { position: absolute; left: 670px; top: 92px; width: 760px; border-radius: 12px; overflow: hidden; box-shadow: 0 40px 80px -20px rgba(0,0,0,.7); border: 1px solid rgba(255,255,255,.15); }
  .shot img { display: block; width: 100%; }
</style></head>
<body>
  <div class="text">
    <div class="brand"><img src="../assets/img/logo.svg" alt="">Divengine Studio</div>
    <h1 id="t"></h1>
    <p id="s"></p>
  </div>
  <div class="tags"><span>Open source</span><span>Self-hosted</span><span>Built on Drupal</span></div>
  <div class="shot"><img id="i" alt=""></div>
  <script>
    const [t, s, i] = decodeURIComponent(location.hash.slice(1)).split("|");
    document.getElementById("t").textContent = t;
    document.getElementById("s").textContent = s;
    document.getElementById("i").src = "../assets/img/screens/" + i + ".jpg";
  </script>
</body></html>
